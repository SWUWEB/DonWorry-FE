name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated API types
        run: npm run api:check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      - name: Type check & Build
        run: npm run build
        env:
          # 타입 검사와 번들 생성만 확인하므로 실제 API 주소는 필요 없습니다.
          # 배포 워크플로에서는 반드시 실제 값을 주입해야 합니다.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://ci.placeholder.invalid' }}
