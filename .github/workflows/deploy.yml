name: Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 같은 브랜치/PR의 이전 배포는 취소해 최신 커밋만 올라가게 합니다.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 포크에서 올라온 PR에는 시크릿이 전달되지 않아 배포할 수 없습니다.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      # 시크릿이 비어 있으면 Vercel CLI가 "--token is missing a value" 같은 메시지로 실패해
      # 원인을 알기 어렵습니다. 먼저 확인하고 무엇을 등록해야 하는지 알려줍니다.
      - name: Check Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"

          if [ -n "$missing" ]; then
            echo "::error::Vercel 배포에 필요한 저장소 시크릿이 없습니다:$missing"
            echo "Settings > Secrets and variables > Actions 에서 등록한 뒤 다시 실행해주세요."
            echo "값은 로컬에서 'npx vercel link' 실행 후 .vercel/project.json 에서 확인할 수 있습니다."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # push하지 않는 워크플로이므로 토큰을 git 설정에 남기지 않습니다.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 배포 토큰을 다루는 도구라 mutable한 latest 대신 버전을 고정합니다.
      - name: Install Vercel CLI
        run: npm install --global vercel@59.11.2

      # main 브랜치 push만 프로덕션으로 나가고, 나머지(PR·develop)는 미리보기로 올라갑니다.
      - name: Resolve target environment
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      # Vercel 프로젝트에 등록된 환경 변수(VITE_API_BASE_URL 등)를 내려받습니다.
      # 값이 비어 있으면 vite.config.ts의 가드가 빌드를 실패시킵니다.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ steps.target.outputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ steps.target.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### 배포 완료 (${{ steps.target.outputs.environment }})" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->'
            const body = `${marker}\n🚀 **미리보기 배포**: ${process.env.PREVIEW_URL}\n\n커밋 \`${context.sha.slice(0, 7)}\` 기준입니다.`
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((comment) => comment.body?.startsWith(marker))

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
            }
